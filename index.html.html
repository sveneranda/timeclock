<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-Do List App</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      background: white;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      width: 100%;
      max-width: 500px;
      padding: 30px;
    }

    h1 {
      color: #333;
      margin-bottom: 10px;
      font-size: 28px;
      text-align: center;
    }

    .subtitle {
      text-align: center;
      color: #999;
      margin-bottom: 25px;
      font-size: 14px;
    }

    .input-section {
      display: flex;
      gap: 10px;
      margin-bottom: 25px;
    }

    #taskInput {
      flex: 1;
      padding: 12px 15px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 16px;
      transition: border-color 0.3s;
    }

    #taskInput:focus {
      outline: none;
      border-color: #667eea;
    }

    button {
      padding: 12px 24px;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.3s;
    }

    button:hover {
      background: #5568d3;
    }

    button:active {
      transform: scale(0.98);
    }

    .filters {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .filter-btn {
      padding: 8px 16px;
      background: #f0f0f0;
      color: #333;
      border: 2px solid transparent;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.3s;
    }

    .filter-btn.active {
      background: #667eea;
      color: white;
      border-color: #667eea;
    }

    .filter-btn:hover {
      background: #e0e0e0;
    }

    .filter-btn.active:hover {
      background: #5568d3;
    }

    .task-list {
      max-height: 500px;
      overflow-y: auto;
      margin-bottom: 20px;
    }

    .task-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      background: #f9f9f9;
      border-radius: 8px;
      margin-bottom: 10px;
      transition: all 0.3s;
    }

    .task-item:hover {
      background: #f0f0f0;
      transform: translateX(5px);
    }

    .task-item.completed {
      opacity: 0.6;
    }

    .task-item.completed .task-text {
      text-decoration: line-through;
      color: #999;
    }

    .task-checkbox {
      width: 20px;
      height: 20px;
      cursor: pointer;
      accent-color: #667eea;
    }

    .task-content {
      flex: 1;
      min-width: 0;
    }

    .task-text {
      color: #333;
      font-size: 15px;
      word-break: break-word;
    }

    .task-priority {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      margin-top: 4px;
    }

    .priority-high {
      background: #ffebee;
      color: #c62828;
    }

    .priority-medium {
      background: #fff3e0;
      color: #e65100;
    }

    .priority-low {
      background: #e8f5e9;
      color: #2e7d32;
    }

    .task-date {
      font-size: 12px;
      color: #999;
      margin-top: 4px;
    }

    .delete-btn {
      padding: 6px 12px;
      background: #ff6b6b;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      transition: background 0.3s;
    }

    .delete-btn:hover {
      background: #ff5252;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 20px;
      text-align: center;
    }

    .stat {
      background: #f5f5f5;
      padding: 12px;
      border-radius: 8px;
    }

    .stat-value {
      font-size: 24px;
      font-weight: bold;
      color: #667eea;
    }

    .stat-label {
      font-size: 12px;
      color: #999;
      margin-top: 4px;
    }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: #999;
    }

    .empty-state-icon {
      font-size: 48px;
      margin-bottom: 10px;
    }

    .action-buttons {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    .action-buttons button {
      flex: 1;
      padding: 10px;
      background: #f0f0f0;
      color: #333;
      border: 2px solid #e0e0e0;
    }

    .action-buttons button:hover {
      background: #e0e0e0;
    }

    .action-buttons .clear-btn {
      background: #ff6b6b;
      color: white;
      border-color: #ff6b6b;
    }

    .action-buttons .clear-btn:hover {
      background: #ff5252;
    }

    .priority-selector {
      margin-top: 10px;
      display: flex;
      gap: 8px;
    }

    .priority-option {
      padding: 6px 12px;
      border: 2px solid #e0e0e0;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      transition: all 0.3s;
    }

    .priority-option.selected {
      border-color: #667eea;
      background: #667eea;
      color: white;
    }

    @media (max-width: 480px) {
      .container {
        padding: 20px;
      }

      h1 {
        font-size: 24px;
      }

      .stats {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>📝 To-Do List</h1>
    <p class="subtitle">Organize your tasks with local storage</p>

    <!-- Stats -->
    <div class="stats">
      <div class="stat">
        <div class="stat-value" id="totalTasks">0</div>
        <div class="stat-label">Total Tasks</div>
      </div>
      <div class="stat">
        <div class="stat-value" id="completedTasks">0</div>
        <div class="stat-label">Completed</div>
      </div>
      <div class="stat">
        <div class="stat-value" id="pendingTasks">0</div>
        <div class="stat-label">Pending</div>
      </div>
    </div>

    <!-- Input Section -->
    <div class="input-section">
      <input 
        type="text" 
        id="taskInput" 
        placeholder="Add a new task..." 
        onkeypress="if(event.key === 'Enter') addTask()"
      >
      <button onclick="addTask()">+ Add</button>
    </div>

    <!-- Priority Selector -->
    <div class="priority-selector">
      <label style="flex: 1; display: flex; align-items: center; gap: 8px; font-size: 14px; color: #666;">
        Priority:
      </label>
      <div id="priorityButtons" style="flex: 1; display: flex; gap: 8px;">
        <button class="priority-option selected" data-priority="low" onclick="selectPriority('low')">Low</button>
        <button class="priority-option" data-priority="medium" onclick="selectPriority('medium')">Med</button>
        <button class="priority-option" data-priority="high" onclick="selectPriority('high')">High</button>
      </div>
    </div>

    <!-- Filters -->
    <div class="filters">
      <button class="filter-btn active" onclick="filterTasks('all')">All</button>
      <button class="filter-btn" onclick="filterTasks('pending')">Pending</button>
      <button class="filter-btn" onclick="filterTasks('completed')">Completed</button>
      <button class="filter-btn" onclick="filterTasks('high')">🔴 High</button>
    </div>

    <!-- Task List -->
    <div class="task-list" id="taskList"></div>

    <!-- Action Buttons -->
    <div class="action-buttons">
      <button onclick="exportTasks()">⬇️ Export</button>
      <button class="clear-btn" onclick="clearCompleted()">🗑️ Clear Completed</button>
    </div>
  </div>

  <script>
    // Local Storage Key
    const STORAGE_KEY = 'todo_tasks';
    const PRIORITY_KEY = 'todo_priority';

    // State
    let tasks = [];
    let currentFilter = 'all';
    let selectedPriority = 'low';

    // Initialize
    function init() {
      loadTasks();
      renderTasks();
      updateStats();
    }

    // Load tasks from local storage
    function loadTasks() {
      const stored = localStorage.getItem(STORAGE_KEY);
      tasks = stored ? JSON.parse(stored) : [];
      
      // Load saved priority selection
      const savedPriority = localStorage.getItem(PRIORITY_KEY);
      if (savedPriority) {
        selectedPriority = savedPriority;
        updatePriorityUI();
      }
    }

    // Save tasks to local storage
    function saveTasks() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
      localStorage.setItem(PRIORITY_KEY, selectedPriority);
      updateStats();
    }

    // Add task
    function addTask() {
      const input = document.getElementById('taskInput');
      const text = input.value.trim();

      if (!text) {
        alert('Please enter a task!');
        return;
      }

      const task = {
        id: Date.now(),
        text: text,
        completed: false,
        priority: selectedPriority,
        date: new Date().toLocaleDateString('en-US', {
          month: 'short',
          day: 'numeric'
        })
      };

      tasks.push(task);
      saveTasks();
      input.value = '';
      renderTasks();
    }

    // Delete task
    function deleteTask(id) {
      tasks = tasks.filter(t => t.id !== id);
      saveTasks();
      renderTasks();
    }

    // Toggle task completion
    function toggleTask(id) {
      const task = tasks.find(t => t.id === id);
      if (task) {
        task.completed = !task.completed;
        saveTasks();
        renderTasks();
      }
    }

    // Filter tasks
    function filterTasks(type) {
      currentFilter = type;
      document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
      renderTasks();
    }

    // Select priority
    function selectPriority(priority) {
      selectedPriority = priority;
      updatePriorityUI();
    }

    // Update priority UI
    function updatePriorityUI() {
      document.querySelectorAll('.priority-option').forEach(btn => {
        btn.classList.remove('selected');
        if (btn.dataset.priority === selectedPriority) {
          btn.classList.add('selected');
        }
      });
    }

    // Render tasks
    function renderTasks() {
      const taskList = document.getElementById('taskList');
      let filtered = tasks;

      // Apply filter
      if (currentFilter === 'pending') {
        filtered = tasks.filter(t => !t.completed);
      } else if (currentFilter === 'completed') {
        filtered = tasks.filter(t => t.completed);
      } else if (currentFilter === 'high') {
        filtered = tasks.filter(t => t.priority === 'high' && !t.completed);
      }

      if (filtered.length === 0) {
        taskList.innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon">📭</div>
            <p>No tasks yet. Create one to get started!</p>
          </div>
        `;
        return;
      }

      taskList.innerHTML = filtered.map(task => `
        <div class="task-item ${task.completed ? 'completed' : ''}">
          <input 
            type="checkbox" 
            class="task-checkbox" 
            ${task.completed ? 'checked' : ''}
            onchange="toggleTask(${task.id})"
          >
          <div class="task-content">
            <div class="task-text">${escapeHtml(task.text)}</div>
            <div class="task-priority priority-${task.priority}">
              ${task.priority.toUpperCase()}
            </div>
            <div class="task-date">${task.date}</div>
          </div>
          <button class="delete-btn" onclick="deleteTask(${task.id})">Delete</button>
        </div>
      `).join('');
    }

    // Update stats
    function updateStats() {
      const total = tasks.length;
      const completed = tasks.filter(t => t.completed).length;
      const pending = total - completed;

      document.getElementById('totalTasks').textContent = total;
      document.getElementById('completedTasks').textContent = completed;
      document.getElementById('pendingTasks').textContent = pending;
    }

    // Clear completed tasks
    function clearCompleted() {
      if (confirm('Are you sure you want to delete all completed tasks?')) {
        tasks = tasks.filter(t => !t.completed);
        saveTasks();
        renderTasks();
      }
    }

    // Export tasks
    function exportTasks() {
      const csv = 'Task,Priority,Status,Date\n' + tasks.map(t => 
        `"${escapeHtml(t.text)}",${t.priority},${t.completed ? 'Completed' : 'Pending'},${t.date}`
      ).join('\n');

      const blob = new Blob([csv], { type: 'text/csv' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `tasks_${new Date().toISOString().split('T')[0]}.csv`;
      a.click();
      URL.revokeObjectURL(url);
    }

    // Escape HTML
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // Start app
    init();
  </script>
</body>
</html>
